name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Test
        working-directory: backend
        run: pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t reflex .
      - name: Smoke test
        run: |
          docker run -d --name reflex -p 7860:7860 reflex
          for i in $(seq 1 30); do
            curl -fs http://localhost:7860/api/health && break
            sleep 1
          done
          curl -fs http://localhost:7860/api/health
          curl -fs -o /dev/null http://localhost:7860/
          curl -fs -o /dev/null http://localhost:7860/preview.html
          docker logs reflex

  deploy:
    # Mirrors the repo to the Hugging Face Space. Skipped until you add the secret and variables.
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_USER: ${{ vars.HF_USER }}
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - uses: actions/checkout@v4
      - name: Push to the Space
        if: env.HF_TOKEN != '' && env.HF_USER != '' && env.HF_SPACE != ''
        run: |
          mkdir ../space
          git archive HEAD | tar -x -C ../space
          cd ../space
          { printf -- '---\ntitle: Reflex\nemoji: 🪞\ncolorFrom: blue\ncolorTo: gray\nsdk: docker\napp_port: 7860\npinned: false\n---\n\n'; cat README.md 2>/dev/null || true; } > README.md.new
          mv README.md.new README.md
          git init -q -b main
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -q --force "https://${HF_USER}:${HF_TOKEN}@huggingface.co/spaces/${HF_USER}/${HF_SPACE}" main