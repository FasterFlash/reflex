[project]
name = "reflex"
version = "0.1.0"
description = "Reads a Google Takeout YouTube history back to you."
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "ftfy>=6.2",
    "tzdata",          # Windows has no system timezone database
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
reflex = "reflex.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
